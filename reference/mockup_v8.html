function summary(r){const p=peer(r),paid=p.filter(v=>v.paid>0),avg=paid.length?Math.round(paid.reduce((s,v)=>s+v.paid,0)/paid.length/100)*100:null;const sit={};p.forEach(v=>{if(v.situation)sit[v.situation]=(sit[v.situation]||0)+1});const top=Object.entries(sit).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k,n])=>`${k} ${n}`).join(' · ');return{count:p.length,avg,paidN:paid.length,top}}

/* ---------- schematic map (real coordinates, not a real map) ---------- */
function mapSVG(rows){const W=280,H=280,pad=18,c=Math.cos(HQ.lat*Math.PI/180),m=r=>({x:(r.lng-HQ.lng)*c*111320,y:(r.lat-HQ.lat)*110540});const near=restaurants.filter(r=>r.lat!=null&&r.lng!=null).map(m).filter(p=>Math.hypot(p.x,p.y)<=1300).concat([{x:0,y:0}]);const minX=Math.min(...near.map(p=>p.x)),maxX=Math.max(...near.map(p=>p.x)),minY=Math.min(...near.map(p=>p.y)),maxY=Math.max(...near.map(p=>p.y));const s=Math.min((W-2*pad)/Math.max(maxX-minX,1),(H-2*pad)/Math.max(maxY-minY,1)),ox=(W-(maxX-minX)*s)/2,oy=(H-(maxY-minY)*s)/2;const T=p=>({x:ox+(p.x-minX)*s,y:oy+(maxY-p.y)*s}),P=r=>T(m(r)),hq=T({x:0,y:0});const ring=d=>`<circle cx="${hq.x.toFixed(1)}" cy="${hq.y.toFixed(1)}" r="${(d*s).toFixed(1)}" fill="none" stroke="#cdbfae" stroke-dasharray="3 4"/><text x="${(hq.x+d*s*0.71+3).toFixed(1)}" y="${(hq.y+d*s*0.71+10).toFixed(1)}" font-size="9" fill="#8a7b6b">${d>=1000?d/1000+'km':d+'m'}</text>`;const placed=rows.filter(r=>r.lat!=null),out=placed.filter(r=>{const p=P(r);return p.x<4||p.x>W-4||p.y<4||p.y>H-4});const pins=placed.filter(r=>!out.includes(r)).map(r=>{const p=P(r);return`<g class="pin" data-detail="${esc(r.id)}" tabindex="0" role="button" aria-label="${esc(r.name)} 상세 보기"><title>${esc(r.name)} · ${esc(walk(r))}</title><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="8" fill="transparent"/><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="var(--orange)" stroke="#fff" stroke-width="1.3"/></g>`}).join('');return{svg:`<svg class="map-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="본사 기준 후보 식당 위치 약도"><g>${ring(500)}${ring(1000)}</g>${pins}<rect x="${(hq.x-6).toFixed(1)}" y="${(hq.y-6).toFixed(1)}" width="12" height="12" rx="3" fill="var(--ink)" stroke="#fff" stroke-width="1.5"/><text x="${(hq.x-9).toFixed(1)}" y="${(hq.y+18).toFixed(1)}" text-anchor="end" font-size="10" font-weight="700" fill="var(--ink)">본사</text><text x="${W-8}" y="16" text-anchor="end" font-size="9" fill="#8a7b6b">↑ 북</text></svg>`,out:out.length,missing:rows.length-placed.length}}
function mapPanel(rows){const m=mapSVG(rows);return`<div class="map-panel"><h3>식당 위치 한눈에</h3><p>목록과 같은 후보 ${rows.length}곳을 본사 기준으로 표시해요. 점을 누르면 상세로 이동해요.</p>${m.svg}<div class="map-legend"><span>■ 본사(한강대로 100)</span><span><b style="color:var(--orange)">●</b> 후보 식당</span><span>점선: 직선 500m·1km</span></div>${m.out?`<p class="map-extra">약도 범위 밖 ${m.out}곳은 목록에서 확인해 주세요.</p>`:''}${m.missing?`<p class="map-extra">위치 확인 중 ${m.missing}곳은 목록에만 표시돼요.</p>`:''}<div class="placeholder">약도 · Google 지도 좌표로 그린 위치이며 실제 지도 서비스가 아니에요. 실제 지도 연결은 빌드팀이 확정해요.</div></div>`}

function card(r){const p=peer(r),last=p.at(-1),memo=r.reviews.find(v=>v.kind==='research');const snippet=last?last.text:memo?'조사 메모: '+memo.text:'첫 후기를 남겨주세요.';return `<article class="card-wrap">${pickBtn(r)}<button class="card" data-detail="${esc(r.id)}" aria-label="${esc(r.name)} 상세 보기"><div class="card-art g-${groupOf(r)}">${glyph(r)}<span class="art-context">${esc(r.walk==null?r.region:'도보 '+r.walk+'분')}</span></div><div class="card-body"><div class="card-title">${esc(r.name)}</div><div class="card-mini">${esc(r.walk==null?'위치 확인 중':'도보 '+r.walk+'분')} · ${esc(r.sub||r.cuisine)}</div><div class="card-meta">${esc(walk(r))} · ${esc(kind(r))}${r.menu!==r.sub?' · '+esc(r.menu):''} · ${price(r)}</div><div class="tags">${tags(r)}</div><p class="review-snippet">“${esc(snippet)}”</p><div class="card-foot"><strong>동료 후기 ${p.length}개${p.some(v=>v.kind==='virtual')?' (가상)':''}</strong><span>↗</span></div></div></button></article>`}

app.innerHTML=`<section class="hero"><div><div class="eyebrow">동료의 추천, 쌓이는 경험</div><h1>오늘은 어디서 먹을까요?</h1><p>점심부터 회식, 출장지의 한 끼까지.<br>동료가 남긴 경험을 보고, 상황에 맞는 식당을 찾아보세요.</p></div><button class="primary" id="hero-random">오늘 한 곳 골라줘 ↗</button></section><section class="filters" aria-label="식당 탐색 조건"><div class="filter-top"><label><select id="region" class="control" aria-label="지역">${options(['전체',...new Set(restaurants.map(r=>r.region))],filters.region)}</select></label><input id="search" class="control search" aria-label="식당명 또는 메뉴 검색" placeholder="식당·메뉴 검색" value="${esc(filters.search)}"></div><div class="quick" aria-label="빠른 찾기"><span>빠른 찾기</span>${QUICK.map(([k,t,,h])=>`<button type="button" class="quick-btn" data-quick="${k}"${h?` title="${h}"`:''}>${t}</button>`).join('')}</div><div class="chips" id="theme-chips">${['전체',...THEMES].map(t=>`<button class="chip${t===filters.theme?' active':''}" data-theme="${esc(t)}" aria-pressed="${t===filters.theme}">${esc(t)}</button>`).join('')}</div><div class="filter-bottom"><details id="extra"${filters.cuisine!=='전체'||filters.budget!=='전체'||filters.walk!=='전체'?' open':''}><summary>음식 종류·예산으로 더 좁히기</summary><div class="extra-filter"><label>음식 종류<select id="cuisine" class="control">${options(['전체',...new Set([...CUISINES,...restaurants.map(r=>r.cuisine)])],filters.cuisine)}</select></label><label>대표 메뉴 1인 가격<select id="budget" class="control">${[['전체','전체'],['10000','10,000원 이하'],['15000','15,000원 이하'],['20000','20,000원 이하']].map(([v,t])=>`<option value="${v}"${v===filters.budget?' selected':''}>${t}</option>`).join('')}</select></label><label>본사에서 도보<select id="walk" class="control">${[['전체','전체'],['5','5분 이내'],['10','10분 이내'],['15','15분 이내']].map(([v,t])=>`<option value="${v}"${v===filters.walk?' selected':''}>${t}</option>`).join('')}</select></label></div><p class="extra-note">예산 검색에서 가격 미확인 추천은 제외됩니다.</p></details><button id="clear-filters" class="quiet">조건 초기화</button></div></section><section><div class="section-line"><div><h2>동료가 남긴 추천 <span class="count" id="count"></span></h2><p id="result-caption"></p></div><button id="list-random">이 조건에서 골라줘 ↗</button></div><button type="button" class="mobile-map-jump" id="mobile-map-jump">지도 영역 보기 ↓</button><div class="content-grid"><div class="cards" id="cards"></div><aside class="side"><div id="map-slot"></div><div class="side-note"><strong>후기는 다음 동료의 길잡이</strong><br>어떤 자리였는지, 1인당 얼마였는지.<br>식사 후 경험을 한 줄 더 남겨주세요.</div></aside></div></section>`;

"alert"></p><button class="primary" type="submit">후기 남기기</button></form></section></section><aside class="detail-info"><h3>식당 정보</h3><dl class="info-list"><div><dt>음식 종류</dt><dd>${esc(r.sub?r.cuisine+' > '+r.sub:r.cuisine)}</dd></div><div><dt>대표 메뉴</dt><dd>${esc(r.menus||r.menu)}</dd></div><div><dt>대표 메뉴 1인 가격</dt><dd>${price(r)}${r.priceNote?` <span class="muted">(${esc(r.priceNote)})</span>`:''}</dd></div><div><dt>지역·주소</dt><dd>${esc(r.region)} · ${esc(r.address)}</dd></div><div><dt>본사에서 거리</dt><dd>${esc(walk(r))}${r.dist?` <span class="muted">(약 ${r.dist.toLocaleString()}m, 직선거리×1.3 추정)</span>`:''}</dd></div>${r.hours?`<div><dt>영업시간 (확인 필요)</dt><dd>${esc(r.hours)}</dd></div>`:''}${r.reserve?`<div><dt>예약 · 웨이팅</dt><dd>${esc(r.reserve)} · ${esc(r.wait)}</dd></div>`:''}<div><dt>추천 상황</dt><dd>${esc(r.tags.join(', '))}</dd></div>${r.gRating?`<div><dt>Google 평점 (참고)</dt><dd>${r.gRating.toFixed(1)} · 리뷰 ${r.gCount.toLocaleString()}개</dd></div>`:''}</dl>${r.link&&validLink(r.link)?`<a href="${esc(r.link)}" target="_blank" rel="noopener noreferrer">지도에서 보기 ↗</a>`:''}<p class="footnote">${r.origin==='research'?`정보 확인일 ${esc(r.checked)} · Google 지도 조사 자료이며 사내 검수 전이에요. `:''}좌석·가격·영업 정보는 방문 전에 확인해주세요. 후기는 구성원의 경험과 의견입니다.</p></aside></div>`;

function register(){detailId=null;view='register';setTimeout(renderPickBar);app.innerHTML=`<div class="register-header"><button class="back" id="cancel-top">← 추천 목록으로</button><div class="eyebrow">나의 경험을 동료에게</div><h1>추천 식당을 하나 더해요</h1><p class="muted">기본 정보와 추천 이유를 남기면, 다음 동료의 선택이 쉬워져요.</p></div><form class="register-panel" id="register-form" novalidate><div class="notice">고객사명, 프로젝트명, 함께한 분의 정보는 적지 말아 주세요.</div><div class="form-grid"><label class="field">식당명 *<input name="name" class="control" required maxlength="60" placeholder="상호명을 입력해주세요"></label><label class="field">지역 *<input name="region" class="control" required maxlength="30" value="용산" placeholder="용산, 부산 등"></label><label class="field full">주소 *<input name="address" class="control" required maxlength="150" placeholder="확인한 주소를 입력해주세요"></label><label class="field">음식 종류 *<select name="cuisine" class="control">${options(CUISINES,'한식')}</select></label><label class="field">세분류<input name="sub" class="control" maxlength="20" placeholder="예: 베트남, 이탈리안, 국밥"><small>선택 · 음식 종류를 더 구체적으로 적어주세요.</small></label><label class="field">대표 메뉴 *<input name="menu" class="control" required maxlength="60" placeholder="대표 메뉴명"></label><label class="field">대표 메뉴 1인 가격<input name="price" class="control" inputmode="numeric" placeholder="예: 12000"><small>선택 · 모르면 비워주세요. 0원으로 넣지 않아요.</small></label><label class="field">표시 이름<input name="author" class="control" maxlength="30" placeholder="선택 · 비워두면 동료로 표시"></label></div><fieldset class="tag-field"><legend>어떤 자리에 추천하나요? * <span class="muted">여러 개 선택 가능</span></legend>${THEMES.map(t=>`<label class="tag-option"><input type="checkbox" name="tags" value="${esc(t)}">${esc(t)}</label>`).join('')}</fieldset><label class="field">추천 이유·첫 후기 *<textarea name="reason" class="control" required maxlength="1000" placeholder="직접 경험한 점이나 추천 근거를 알려주세요. 조사한 정보라면 조사 내용임을 밝혀주세요."></textarea></label><label class="field">출처·지도 링크<input name="link" class="control" placeholder="선택 · https://로 시작하는 주소"><small>확인한 실제 링크가 있을 때 입력해주세요.</small></label><p class="error" id="register-error" role="alert"></p><div class="form-actions"><button type="button" id="cancel-register">취소</button><button type="submit" class="primary" id="register-submit">추천 등록</button></div><p class="footnote">목업에서는 이 브라우저에 저장됩니다. 직접 등록한 식당은 좌표가 없어 '위치 확인 중'으로 표시돼요. 실제 앱은 팀원이 함께 보는 공동 저장소를 연결해야 합니다.</p></form>`;

function filterLabel(){return[filters.region,filters.theme,filters.cuisine,filters.budget==='전체'?'':Number(filters.budget).toLocaleString()+'원 이하',filters.walk==='전체'?'':'도보 '+filters.walk+'분 이내',filters.search?`“${filters.search}”`:''].filter(x=>x&&x!=='전체').join(' · ')||'전체 조건'}

document.getElementById('home').onclick=()=>{if(dlg.open)dlg.close();list();scrollToTop()};document.getElementById('new-top').onclick=register;document.getElementById('decide-top').onclick=()=>{decideState.source=picks.filter(get).length>=2?'picks':'filter';decide()};

/* ---------- 후보 담기 (shortlist) ---------- */
const PKEY='samil-food-map-picks-v1',MAXPICK=8;
let picks=[];try{const x=JSON.parse(localStorage.getItem(PKEY)||'[]');if(Array.isArray(x))picks=x.filter(id=>typeof id==='string')}catch(e){}
function savePicks(){try{localStorage.setItem(PKEY,JSON.stringify(picks))}catch(e){}}
function pickBtn(r,inline){const on=picks.includes(r.id);return`<button type="button" class="pick${inline?' pick-inline':''}${on?' on':''}" data-pick="${esc(r.id)}" aria-pressed="${on}" aria-label="${esc(r.name)} ${on?'후보에서 빼기':'후보에 담기'}"><span class="pk-full">${on?'✓ 후보 담음':'+ 후보 담기'}</span><span class="pk-short" aria-hidden="true">${on?'✓':'+'}</span></button>`}
function togglePick(id){if(picks.includes(id))picks=picks.filter(x=>x!==id);else{if(picks.length>=MAXPICK){notify(`후보는 최대 ${MAXPICK}곳까지 담을 수 있어요.`);return}picks.push(id)}savePicks();document.querySelectorAll(`[data-pick="${CSS.escape(id)}"]`).forEach(b=>{const r=get(id);b.outerHTML=pickBtn(r,b.classList.contains('pick-inline'))});bindPicks();renderPickBar()}
function bindPicks(){document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=e=>{e.stopPropagation();togglePick(b.dataset.pick)})}
let view='list';
function renderPickBar(){const bar=document.getElementById('pick-bar');const n=picks.filter(get).length;if(!n||view==='decide'){bar.hidden=true;return}bar.hidden=false;bar.innerHTML=`<span>담은 후보 <b>${n}</b>곳</span><button type="button" class="quiet" id="pick-clear">비우기</button><button type="button" class="primary" id="pick-go">${n>=2?'함께 결정하기 →':'1곳 더 담아주세요'}</button>`;document.getElementById('pick-clear').onclick=()=>{picks=[];savePicks();if(view==='list')updateResults();else if(view==='detail')detail(detailId);renderPickBar()};document.getElementById('pick-go').onclick=()=>{if(n<2){notify('후보를 2곳 이상 담으면 돌림판·사다리로 정할 수 있어요.');return}decideState.source='picks';decide()}}

/* ---------- S5 함께 결정하기 ---------- */
let decideState={mode:'ladder',source:'picks',rot:0,busy:false,ladder:null};
function decidePool(){return decideState.source==='picks'?picks.map(get).filter(Boolean):candidates().slice(0,8)}
function cut(s,n){s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}
function decide(){view='decide';detailId=null;if(dlg.open)dlg.close();if(decideState.source==='picks'&&picks.filter(get).length<2)decideState.source='filter';const pool=decidePool(),total=candidates().length;decideState.ladder=null;decideState.busy=false;
app.innerHTML=`<button class="back" id="decide-back">← 추천 목록으로</button><section class="decide-head"><div class="eyebrow">못 고르겠다면, 같이 정해요</div><h1>오늘은 어떤 걸로 할까요?</h1><p class="muted">담아 둔 후보나 지금 조건의 후보로 사다리타기나 랜덤 뽑기 중 하나를 골라보세요. 결과는 팀 메신저로 바로 공유할 수 있어요.</p></section><div class="decide-layout"><section class="decide-panel"><div class="seg" role="tablist" aria-label="후보 고르기"><button type="button" class="seg-btn${decideState.source==='picks'?' on':''}" data-src="picks" aria-pressed="${decideState.source==='picks'}">담은 후보 ${picks.filter(get).length}곳</button><button type="button" class="seg-btn${decideState.source==='filter'?' on':''}" data-src="filter" aria-pressed="${decideState.source==='filter'}">현재 조건 가까운 ${Math.min(total,8)}곳</button></div><p class="pool-caption">${decideState.source==='filter'?esc(filterLabel())+` · 본사에서 가까운 순 최대 8곳`:'목록에서 “+ 후보 담기”로 고른 곳이에요. 최대 8곳.'}</p><div class="pool">${pool.map(r=>`<span class="pool-chip">${esc(cut(r.name,12))}<small>${esc(r.walk==null?'위치 확인 중':'도보 '+r.walk+'분')}</small>${decideState.source==='picks'?`<button type="button" class="pool-x" data-unpick="${esc(r.id)}" aria-label="${esc(r.name)} 빼기">×</button>`:''}</span>`).join('')}</div><div class="mode-tabs two" role="tablist" aria-label="결정 방식">${[['ladder','사다리타기'],['random','랜덤 뽑기']].map(([k,t])=>`<button type="button" role="tab" class="mode${decideState.mode===k?' on':''}" data-mode="${k}" aria-selected="${decideState.mode===k}">${t}</button>`).join('')}</div><div id="stage"></div></section><aside class="decide-result" id="decide-result" aria-live="polite"><div class="result-empty"><div class="result-dot"></div><h3>결과가 여기에 나와요</h3><p class="muted">정해진 식당의 상세 보기와 공유 버튼이 함께 보여요.</p></div></aside></div>`;
document.getElementById('decide-back').onclick=()=>{list();scrollToTop()};
document.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{if(b.dataset.src==='picks'&&picks.filter(get).length<2){notify('담은 후보가 2곳 이상이어야 해요. 목록에서 “+ 후보 담기”를 눌러주세요.');return}decideState.source=b.dataset.src;decide()});
document.querySelectorAll('[data-unpick]').forEach(b=>b.onclick=()=>{picks=picks.filter(x=>x!==b.dataset.unpick);savePicks();decide()});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(decideState.busy)return;decideState.mode=b.dataset.mode;decide()});
renderPickBar();renderStage(pool);scrollToTop()}
function renderStage(pool){const st=document.getElementById('stage');if(pool.length<2){st.innerHTML=`<div class="stage-empty"><h3>후보가 2곳 이상 필요해요.</h3><p class="muted">목록에서 “+ 후보 담기”로 고르거나, 조건을 넓혀 주세요.</p><button type="button" id="stage-back">목록으로</button></div>`;document.getElementById('stage-back').onclick=()=>{list();scrollToTop()};return}if(decideState.mode==='ladder')ladder(pool,st);else slot(pool,st)}

/* 사다리타기 */
function makeLadder(n){const rows=9,rungs=[];let cnt=0;for(let y=0;y<rows;y++){const row=[];for(let i=0;i<n-1;i++){const ok=!row.includes(i-1)&&Math.random()<0.5;if(ok){row.push(i);cnt++}}rungs.push(row)}if(cnt<n-1)return makeLadder(n);return rungs}
function ladderPath(rungs,s){let pos=s;const steps=[];rungs.forEach((row,y)=>{if(row.includes(pos)){steps.push([y,pos,pos+1]);pos++}else if(row.includes(pos-1)){steps.push([y,pos,pos-1]);pos--}});return{end:pos,steps}}
function ladder(pool,st){const items=pool.slice(0,6),n=items.length;if(!decideState.ladder||decideState.ladder.n!==n)decideState.ladder={n,rungs:makeLadder(n),names:Array.from({length:n},(_,i)=>`${i+1}번`)};const L=decideState.ladder,W=320,H=300,top=26,bot=268,X=i=>n===1?W/2:24+i*((W-48)/(n-1)),Y=y=>top+(y+1)*((bot-top)/(L.rungs.length+1));const rails=items.map((_,i)=>`<line x1="${X(i)}" y1="${top}" x2="${X(i)}" y2="${bot}" stroke="#bdbdbd" stroke-width="3" stroke-linecap="round"/>`).join('');const rungs=L.rungs.map((row,y)=>row.map(i=>`<line x1="${X(i)}" y1="${Y(y)}" x2="${X(i+1)}" y2="${Y(y)}" stroke="#bdbdbd" stroke-width="3" stroke-linecap="round"/>`).join('')).join('');
st.innerHTML=`<div class="ladder-wrap">${pool.length>6?'<p class="hint">사다리는 최대 6곳이라 앞의 6곳으로 진행해요.</p>':''}<div class="ladder-names" style="grid-template-columns:repeat(${n},1fr)">${L.names.map((nm,i)=>`<label><input class="control" data-lname="${i}" value="${esc(nm)}" maxlength="6" aria-label="${i+1}번 출발점 이름"><button type="button" class="go" data-go="${i}">출발</button></label>`).join('')}</div><svg class="ladder" viewBox="0 0 ${W} ${H}" role="img" aria-label="사다리 ${n}줄">${rails}${rungs}<g id="ladder-path"></g>${items.map((r,i)=>`<circle cx="${X(i)}" cy="${top}" r="5" fill="#2d2d2d"/><circle cx="${X(i)}" cy="${bot}" r="5" fill="#d04a02"/>`).join('')}</svg><div class="ladder-ends" style="grid-template-columns:repeat(${n},1fr)">${items.map(r=>`<span title="${esc(r.name)}">${esc(cut(r.name,8))}</span>`).join('')}</div><div class="ladder-actions"><button type="button" id="ladder-new">사다리 새로 만들기</button></div><p class="hint">출발점 이름을 바꾸고 “출발”을 눌러보세요. 같은 사다리면 같은 결과가 나와요.</p></div>`;
document.querySelectorAll('[data-lname]').forEach(inp=>inp.oninput=()=>{L.names[Number(inp.dataset.lname)]=inp.value.trim()||`${Number(inp.dataset.lname)+1}번`});
document.getElementById('ladder-new').onclick=()=>{if(decideState.busy)return;decideState.ladder=null;renderStage(pool)};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(decideState.busy)return;const s=Number(b.dataset.go),{end,steps}=ladderPath(L.rungs,s);let d=`M${X(s)} ${top}`;steps.forEach(([y,a,c])=>{d+=`L${X(a)} ${Y(y)}L${X(c)} ${Y(y)}`});d+=`L${X(end)} ${bot}`;const g=document.getElementById('ladder-path');g.innerHTML=`<path d="${d}" fill="none" stroke="#d04a02" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;const p=g.firstChild,len=p.getTotalLength?p.getTotalLength():1000;p.style.strokeDasharray=len;p.style.strokeDashoffset=len;p.getBoundingClientRect();p.style.transition='stroke-dashoffset 1.6s ease-in-out';p.style.strokeDashoffset=0;decideState.busy=true;document.querySelectorAll('.ladder-ends span').forEach((sp,i)=>sp.classList.toggle('hit',false));setTimeout(()=>{decideState.busy=false;document.querySelectorAll('.ladder-ends span')[end].classList.add('hit');showResult(items[end],'사다리타기',L.names[s])},1700)})}

/* 랜덤 뽑기 */
function slot(pool,st){st.innerHTML=`<div class="slot-wrap"><div class="slot" id="slot" aria-live="off">?</div><button type="button" class="primary big" id="slot-go">랜덤 뽑기</button><p class="hint">후보 ${pool.length}곳 중 한 곳을 뽑아요. 같은 식당이 다시 나올 수 있어요.</p></div>`;document.getElementById('slot-go').onclick=()=>{if(decideState.busy)return;decideState.busy=true;const btn=document.getElementById('slot-go'),box=document.getElementById('slot');btn.disabled=true;const idx=Math.floor(Math.random()*pool.length);let t=0;const spin=setInterval(()=>{box.textContent=pool[t++%pool.length].name;box.classList.toggle('tick')},90);setTimeout(()=>{clearInterval(spin);box.textContent=pool[idx].name;box.classList.add('done');decideState.busy=false;btn.disabled=false;btn.textContent='다시 뽑기';showResult(pool[idx],'랜덤 뽑기')},1500)}}

function showResult(r,how,who){const box=document.getElementById('decide-result');if(!box)return;box.innerHTML=`<div class="result-card"><div class="eyebrow">${esc(how)}${who?` · ${esc(who)}의 선택`:''} 결과</div><h2>${esc(r.name)}</h2><p class="muted">${esc(walk(r))} · ${esc(r.menu)} · ${price(r)}</p><div class="tags">${tags(r)}</div><button type="button" class="primary" id="res-detail">이 식당 자세히 보기</button><button type="button" id="res-share">팀원에게 공유하기</button><div id="res-share-fallback" hidden><textarea class="control" readonly rows="4"></textarea><small class="muted">문구를 복사해 팀 메신저에 붙여넣어 주세요.</small></div></div>`;document.getElementById('res-detail').onclick=()=>detail(r.id);document.getElementById('res-share').onclick=async()=>{const t=shareText(r).replace('오늘은 여기 어때요?',`${how}로 정했어요!`);try{await navigator.clipboard.writeText(t);notify('공유 문구를 복사했어요. 팀 메신저에 붙여넣어 주세요.')}catch(e){const f=document.getElementById('res-share-fallback');f.hidden=false;const ta=f.querySelector('textarea');ta.value=t;ta.select()}};if(window.matchMedia('(max-width:760px)').matches||document.body.dataset.preview==='mobile')box.scrollIntoView({block:'nearest',behavior:'smooth'})}

function setPreview(mode){document.body.dataset.preview=mode;document.getElementById('preview-mobile').setAttribute('aria-pressed',String(mode==='mobile'));document.getElementById('preview-pc').setAttribute('aria-pressed',String(mode==='pc'))}
document.getElementById('preview-mobile').onclick=()=>setPreview('mobile');document.getElementById('preview-pc').onclick=()=>setPreview('pc');
app.innerHTML='<div class="state"><h3>추천을 불러오는 중이에요.</h3></div>';
setTimeout(()=>{list();if(!storageOK)notify('이 브라우저에서 저장이 제한되어, 추가한 내용은 현재 화면에서만 유지돼요.')},400);

</script>
